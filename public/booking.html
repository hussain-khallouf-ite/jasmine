<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب حجز | الياسمين</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="شعار الياسمين" height="40" class="d-inline-block align-text-top" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'40\' height=\'40\'><circle cx=\'20\' cy=\'20\' r=\'20\' fill=\'%232F5D62\'/></svg>'">
                الياسمين
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                    <li class="nav-item">
                        <a class="nav-link" href="project_overview.html">مشروع الياسمين</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="properties.html">استعراض الشقق</a></li>
                    <li class="nav-item auth-user" style="display: none;"><a class="nav-link" href="my_bookings.html">حجوزاتي</a></li>
                    <li class="nav-item auth-user" style="display: none;"><a class="nav-link" href="profile.html">ملفي</a></li>
                    <li class="nav-item auth-user" style="display: none;"><a class="nav-link" id="logoutLink" href="#">تسجيل الخروج</a></li>
                    <li class="nav-item auth-guest"><a class="nav-link" href="login.html">تسجيل الدخول</a></li>
                    <li class="nav-item auth-guest"><a class="nav-link" href="register.html">إنشاء حساب</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div class="container">
            <h2 class="fw-bold mb-4 text-center">تأكيد طلب الحجز</h2>
            <div id="loadingMessage" class="text-center py-5">
                <div class="spinner-border text-primary-custom" role="status">
                    <span class="visually-hidden">جاري التحميل...</span>
                </div>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none text-center"></div>

            <div id="bookingContent" class="row d-none">
                <div class="col-lg-8 mb-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4">
                            <h4 class="fw-bold mb-4">تفاصيل الحجز</h4>
                            <form id="bookingForm">
                                <div class="row mb-3" id="rentFields">
                                    <div class="col-md-6">
                                        <label for="startDate" class="form-label">تاريخ البدء</label>
                                        <input type="date" class="form-control" id="startDate" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="contractType" class="form-label">نوع العقد</label>
                                        <select class="form-select" id="contractType" required>
                                            <option value="monthly">شهري</option>
                                            <option value="annual">سنوي</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="mb-4" id="occupantsField">
                                    <label for="occupants" class="form-label">عدد الأشخاص</label>
                                    <input type="number" class="form-control" id="occupants" min="1" max="10" required>
                                </div>
                                <div id="formAlert" class="alert alert-danger d-none"></div>
                                <button type="submit" class="btn btn-primary-custom w-100 btn-lg" id="submitBtn">تأكيد مبدئي والمتابعة للدفع</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 sticky-top" style="top: 100px;">
                        <div class="card-body p-4 text-center">
                            <h5 class="fw-bold mb-3">تفاصيل الشقة</h5>
                            <div class="property-img w-100 rounded mb-3" id="propImg" style="height: 150px; background-size: cover; background-position: center;"></div>
                            <h6 id="propTitle" class="fw-bold mb-2"></h6>
                            <p id="propLocation" class="text-muted mb-3 small"><i class="bi bi-geo-alt"></i> </p>
                            <h4 class="fw-bold text-primary-custom" id="propPrice"></h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 text-center mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 الياسمين. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
